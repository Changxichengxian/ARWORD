[preset.0]
name="Android"
platform="Android"
runnable=true
advanced_options=true
export_filter="all_resources"
include_filter="assets/characters/*.vrm,assets/characters/*.json,assets/*.json,assets/*LICENSE*.txt,assets/*COPYRIGHT*.txt,assets/CREDITS.txt,assets/fonts/*OFL.txt,assets/wordbooks/*.json,assets/wordbooks/*.txt,assets/wordbooks/licenses/*"
exclude_filter="art-source/*,tools/*,tests/*,*.blend,assets/wordbooks/sources/*,assets/wordbooks/content-review.json,assets/wordbooks/audio-audit.json,assets/fonts/NotoSansSC.ttf,assets/fonts/NotoSans.ttf"
export_path=""

[preset.0.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/compress_native_libraries=true
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
version/code=22
version/name="0.14.1"
package/unique_name="io.github.changxichengxian.arword"
package/name="ARWORD"
launcher_icons/main_192x192="res://assets/icon.png"
launcher_icons/adaptive_foreground_432x432="res://assets/icon-foreground.png"
launcher_icons/adaptive_background_432x432="res://assets/icon-background.png"
package/signed=false
package/retain_data_on_uninstall=false
screen/immersive_mode=true
user_data_backup/allow=false
permissions/internet=true
permissions/vibrate=false
shader_baker/enabled=false
